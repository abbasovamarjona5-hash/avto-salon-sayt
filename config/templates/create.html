
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avtomobil qo'shish</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #101113;
            color: white;
            font-family: Arial, sans-serif;
        }

        .form-container {
            max-width: 650px;
            margin: 60px auto;
            background: #191b1f;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        h2 {
            text-align: center;
            font-weight: bold;
            margin-bottom: 30px;
        }

        h2 span {
            color: #d5ad63;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-control {
            background: #25272b;
            color: white;
            border: 1px solid #444;
            padding: 12px;
            margin-bottom: 20px;
        }

        .form-control:focus {
            background: #25272b;
            color: white;
            border-color: #d5ad63;
            box-shadow: none;
        }

        .form-control::file-selector-button {
            background: #d5ad63;
        }

        .btn-add {
            width: 100%;
            background: #d5ad63;
            color: #111;
            font-weight: bold;
            padding: 13px;
            border: none;
            border-radius: 5px;
        }

        .btn-add:hover {
            background: white;
        }

        .back {
            display: block;
            text-align: center;
            color: #d5ad63;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-container">

        <h2>AVTOMOBIL <span>QO'SHISH</span></h2>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <label>Avtomobil nomi</label>
            <input type="text" name="name" class="form-control"
                   placeholder="Masalan: Mercedes-Benz E200" required>

            <label>Avtomobil haqida</label>
            <textarea name="description" class="form-control"
                      rows="4" placeholder="Avtomobil haqida ma'lumot..." required></textarea>

            <label>Narxi (so'm)</label>
            <input type="number" name="price" class="form-control"
                   placeholder="Masalan: 500000000" min="0" step="0.01" required>

            <label>Miqdori</label>
            <input type="number" name="quantity" class="form-control"
                   placeholder="Avtomobil soni" min="0" value="1" required>

            <label>Avtomobil rasmi</label>
            <input type="file" name="image" class="form-control"
                   accept="image/*">

            <button type="submit" class="btn-add">
                + AVTOMOBIL QO'SHISH
            </button>

        </form>

        <a href="{% url 'home' %}" class="back">
            ← Bosh sahifaga qaytish
        </a>

    </div>

</div>

</body>
</html>
